# Example: serve Atten under https://your-domain/attendance/ behind nginx.
#
# Paste these blocks inside your existing HTTPS `server { ... }` block.
# Run the app with TRUST_PROXY=1 (see .env.example) so it honours
# X-Forwarded-Prefix (links keep the /attendance prefix) and reads the real
# client address from X-Forwarded-For.
#
# To serve at the domain root instead, use `location / { ... }`, drop the
# X-Forwarded-Prefix header, and point proxy_pass at http://127.0.0.1:5001.

    location ^~ /attendance/ {
        # The trailing slash strips "/attendance" before the request reaches Flask;
        # X-Forwarded-Prefix puts it back into generated links.
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Prefix /attendance;
        proxy_redirect off;

        # Profile photos are capped at 5 MB in the app; nginx's 1 MB default
        # would reject them with a 413 first.
        client_max_body_size 6m;
    }

    location = /attendance {
        return 301 /attendance/;
    }
