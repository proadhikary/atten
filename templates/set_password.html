<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set password · Atten</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Atten" class="auth-logo">
      <h1>Welcome, {{ user.name.split()[0] }}</h1>
      <p class="muted">{{ user.lab_id }} · {{ user.designation }}</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="auth-form">
      <input type="hidden" name="lab_id" value="{{ user.lab_id }}">
      <label>Create password
        <input type="password" name="password" placeholder="At least 6 characters" required>
      </label>
      <label>Confirm password
        <input type="password" name="password2" placeholder="Repeat password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create & continue</button>
    </form>
  </div>
</body>
</html>
