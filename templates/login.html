<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Atten</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Atten" class="auth-logo">
      <h1><b>Atten</b></h1>
      <p class="muted">Attendance for the {{ lab_name }}</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="auth-form">
      <label>Lab ID
        <input type="text" name="lab_id" placeholder="e.g. 26PHD0015" autofocus required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Your password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="auth-hint muted">First time here? Enter your Lab ID and any password — you'll be asked to create one.</p>
  </div>
</body>
</html>
